<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="page">
        <section class="profile" aria-label="ข้อมูลส่วนตัว">
            <div class="profile__photo-frame">
                <img
                    class="profile__image"
                    src="IMG_2010.JPG"
                    alt="รูปโปรไฟล์"
                >
            </div>
            <div class="profile__details">
                <h1>นาย กรวิชญ์ แนบเนียน</h1>
                <p><span>อายุ</span><strong>20 ปี</strong></p>
                <p><span>เลขที่</span><strong>1</strong></p>
                <p><span>เวลาว่าง</span><strong>เล่นฟุตบอล</strong></p>
                <p><span>ชั้น</span><strong>ปวช.3</strong></p>
                <p><span>แผนก</span><strong>เทคโนโลยีสารสนเทศ</strong></p>
                <p><span>สถานศึกษา</span><strong>วิทยาลัยอาชีวศึกษานครศรีธรรมราช</strong></p>
                <p><span>งานอดิเรก</span><strong>เล่นฟุตบอล</strong></p>
                <p class="profile__address"><span>ที่อยู่</span><strong>จ.นครศรีธรรมราช อ.พระพรหม ต.นาพรุ 29 หมู่ 1</strong></p>
            </div>
        </section>
    </main>
</body>
</html>
